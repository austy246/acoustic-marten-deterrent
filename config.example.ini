# Konfigurace akustického plašiče kun.
# Zkopíruj na config.ini a uprav podle potřeby. Všechny klíče jsou nepovinné
# (mají rozumný default); chybějící klíč = default.

[marten]

# --- Audio výstup ---
# Výstupní zařízení. Prázdné = výchozí ALSA zařízení.
# Může být index (viz --list-devices) nebo část jména (USB zvukovka).
audio_device =
# Vzorkovací frekvence. 44100 je bezpečná všude.
sample_rate = 44100

# --- Hlasitost a ochrana reproduktoru ---
# Master hlasitost 0–1. Hrubé nastavení dělej v alsamixeru, tady dolaď.
master_volume = 0.9
# Digitální rezerva pod clip. Špičky nikdy nepřekročí tuto hranici (v dBFS, <= 0).
peak_ceiling_dbfs = -3
# Fade in/out na okrajích každého prvku (ms), ať repro necvaká.
fade_ms = 5

# --- Časování / duty cycle ---
# Náhodná pauza mezi salvami (s). Nízký duty cycle = cívka chladne + proti habituaci.
min_gap_s = 8
max_gap_s = 45

# --- Frekvenční obsah ---
# Default ~1–16 kHz. Nad 16 kHz to akusticky nepřidá (jen hřeje cívku).
freq_min = 1000
freq_max = 16000

# --- Startup sekvence ---
# Délka úvodní salvy po spuštění (s) na nastavení hlasitosti. 0 = vypnout
# (rovnou normální provoz s náhodnými pauzami).
startup_test_s = 8

# --- Bezpečnost / běh ---
# Po této době nepřetržitého běhu se plašič SÁM přepne do off (pojistka pro
# případ výpadku internetu). Nahození: zapiš 'on' do stavového souboru nebo
# restartuj službu.
max_runtime_hours = 12
# Stavový soubor (obsah on/off) pro ovládání bez restartu procesu.
state_file = /run/marten/state

# --- Keepalive (volitelné) ---
# Velmi tichý tón během pauz, ať neusínají aktivní repro s auto-standby.
# U USB-napájených repro netřeba (necháváme false).
keepalive = false
keepalive_level_dbfs = -50
